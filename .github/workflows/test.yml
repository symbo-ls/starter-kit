# Drop into <repo>/.github/workflows/test.yml
#
# Per-repo CI gate. Runs on every push to main and on PRs. Native to the
# repo so failures appear as Check Runs on the commit/PR — visible to
# everyone working in this repo without needing access to release-manager.
#
# This workflow is the GATE for notify-release.yml: only when this Test
# workflow concludes `success` does notify-release dispatch the manager.
# A failure here means the manager is never invoked, no publish happens,
# and the broken commit cannot ripple into downstream consumers.
#
# Required secrets on this repo (or set at org level):
#   - INFISICAL_CLIENT_ID / INFISICAL_CLIENT_SECRET — universal-auth
#     machine identity for km.api.symbols.app. Same identity that
#     release-manager uses; this workflow uses it to fetch NPM_TOKEN +
#     GITHUB_PACKAGES_TOKEN at runtime so token rotation is centralized
#     in Infisical (no per-repo secret juggling).

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight Test run when a new push lands on the same ref —
# we only care about the latest commit's verdict.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Reuse the same ~/.npm cache strategy as the existing Dev / deploy
      # workflows. Tarball cache survives even if a referenced version
      # was unpublished from the registry (which has bitten us before).
      # Keyed by package.json content so any dep change busts the cache.
      - name: Cache ~/.npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Fetch tokens from Infisical + write .npmrc
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          # Static-secret fallback. If Infisical creds aren't set on
          # this repo, we fall back to the per-repo secrets — same shape
          # as before, just no longer required when Infisical is wired up.
          NPM_TOKEN_FALLBACK: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN_FALLBACK: ${{ secrets.GITHUB_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          NPM_TOKEN=""
          GH_PKG_TOKEN=""

          if [ -n "${INFISICAL_CLIENT_ID:-}" ] && [ -n "${INFISICAL_CLIENT_SECRET:-}" ]; then
            curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
            sudo apt-get update && sudo apt-get install -y infisical
            INFISICAL_TOKEN=$(infisical login \
              --method=universal-auth \
              --client-id="$INFISICAL_CLIENT_ID" \
              --client-secret="$INFISICAL_CLIENT_SECRET" \
              --domain="https://km.api.symbols.app/api" \
              --plain --silent)
            echo "::add-mask::$INFISICAL_TOKEN"

            NPM_TOKEN=$(infisical secrets get NPM_TOKEN_PUBLISH \
              --projectId=a95028f1-c89b-4d5e-87a2-d6badfb3ab4b \
              --env=production \
              --domain="https://km.api.symbols.app/api" \
              --token="$INFISICAL_TOKEN" \
              --plain 2>/dev/null || true)
            GH_PKG_TOKEN=$(infisical secrets get GITHUB_PACKAGES_TOKEN \
              --projectId=a95028f1-c89b-4d5e-87a2-d6badfb3ab4b \
              --env=production \
              --domain="https://km.api.symbols.app/api" \
              --token="$INFISICAL_TOKEN" \
              --plain 2>/dev/null || true)
          fi

          # Fall back to per-repo secrets if Infisical didn't yield a value.
          NPM_TOKEN="${NPM_TOKEN:-$NPM_TOKEN_FALLBACK}"
          GH_PKG_TOKEN="${GH_PKG_TOKEN:-$GH_TOKEN_FALLBACK}"

          [ -n "$NPM_TOKEN" ] && echo "::add-mask::$NPM_TOKEN"
          [ -n "$GH_PKG_TOKEN" ] && echo "::add-mask::$GH_PKG_TOKEN"

          # actions/setup-node points npm at a temp userconfig — write
          # there, not $HOME/.npmrc, otherwise npm won't read it.
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          {
            if [ -n "$NPM_TOKEN" ]; then
              echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN"
              echo "always-auth=true"
            else
              echo "::warning::No NPM_TOKEN (Infisical or repo secret) — install of restricted @symbo.ls/* packages will 404." 1>&2
            fi
            if [ -n "$GH_PKG_TOKEN" ]; then
              echo "@symbo-ls:registry=https://npm.pkg.github.com"
              echo "//npm.pkg.github.com/:_authToken=$GH_PKG_TOKEN"
            fi
          } >> "$NPMRC"

      - name: Install
        run: |
          # Prefer npm install when the repo ships a package-lock.json:
          #   - npm uses the lock's pinned tarball URLs, skipping scope-
          #     metadata lookups; that avoids 404s on restricted scopes
          #     like @symbo.ls/* when NPM_TOKEN with read access isn't set.
          #   - we use `install` (not `ci`) so a slightly stale lockfile
          #     doesn't fail the gate — same pattern as existing per-repo
          #     deploy workflows. --no-audit + --ignore-scripts keep
          #     this fast and side-effect-free.
          # Falls back to bun install for repos that ship bun.lock instead.
          if [ -f package-lock.json ]; then
            npm install --no-audit --ignore-scripts
          else
            bun install --frozen-lockfile || bun install
          fi

      # --ignore-scripts above suppresses workspace-package `prepare`
      # hooks, so dist-only packages won't have built dist/ yet. Run a
      # generic build pass; --if-present skips packages without a build
      # script. Tolerant of failures (`|| true`) — if a missing build
      # output actually matters, the test step below will surface it.
      - name: Build workspace packages
        run: npm run build --workspaces --if-present 2>&1 | tail -100 || true

      - name: Test
        run: |
          if [ -f "scripts/test.sh" ]; then
            bash scripts/test.sh
          elif jq -e '.scripts.test' package.json > /dev/null; then
            npm test
          else
            echo "No tests configured — running install-only smoke test."
            echo "(That's not nothing — install/resolution failures still gate publish.)"
          fi
