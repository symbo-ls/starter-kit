# Drop into <repo>/.github/workflows/consumer-test.yml
#
# Thin wrapper that calls release-manager's reusable consumer-test
# workflow. Triggered when manager publishes upstream packages this
# repo consumes.

name: Consumer test (upstream-bumped)

on:
  repository_dispatch:
    types: [upstream-bumped]

concurrency:
  group: consumer-test-${{ github.event.client_payload.source_repo }}
  cancel-in-progress: true

jobs:
  consumer-test:
    uses: symbo-ls/.github/.github/workflows/consumer-test-reusable.yml@main
    secrets: inherit
