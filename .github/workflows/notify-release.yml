# Drop into <repo>/.github/workflows/notify-release.yml
#
# Dispatches a `source-changed` event to release-manager AFTER the local
# Test workflow has concluded successfully on a push to main. The
# `workflow_run` trigger is the gate: if Test fails, this never runs,
# the manager is never invoked, and the broken commit cannot publish.
#
# Required secret on this repo: RELEASE_MANAGER_DISPATCH_TOKEN — a GitHub
# Classic PAT with `repo` scope on symbo-ls/release-manager (SSO authorized).

name: Notify release-manager

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # Skip when:
    #  - the Test workflow itself failed (don't publish broken code)
    #  - the head commit is a chore(release) bump (avoid republish loop)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_commit.message != null &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(release)')
    steps:
      - name: Dispatch source-changed to release-manager
        uses: peter-evans/repository-dispatch@v3
        with:
          # RELEASE_PAT is the canonical single-name secret; the `||` fallback
          # is temporary until the old RELEASE_MANAGER_DISPATCH_TOKEN secret
          # is deleted from this repo.
          token: ${{ secrets.RELEASE_PAT || secrets.RELEASE_MANAGER_DISPATCH_TOKEN }}
          repository: symbo-ls/release-manager
          event-type: source-changed
          client-payload: |
            {
              "repo": "${{ github.repository }}",
              "ref": "${{ github.event.workflow_run.head_branch }}",
              "sha": "${{ github.event.workflow_run.head_sha }}",
              "actor": "${{ github.event.workflow_run.actor.login }}",
              "message": ${{ toJSON(github.event.workflow_run.head_commit.message) }}
            }
